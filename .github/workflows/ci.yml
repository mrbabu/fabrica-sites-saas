name: CI

# Espelha o gate local (.githooks/pre-commit): mesma entrada, mesmo runner.
# O hook protege o commit; isto protege o histórico e os PRs.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo ref cancela o run anterior — não faz sentido esperar
# CI de um commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: QA (suíte rápida)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Executar QA
        env:
          # O runner do GitHub é UTF-8, mas o runner de QA imprime emoji —
          # explicitar evita surpresa se a imagem base mudar.
          PYTHONIOENCODING: utf-8
        run: python backend/qa.py

      # Ponto de extensão: as fases seguintes (pytest, cobertura, snapshot)
      # passam a gerar arquivos aqui. Enquanto não geram, o passo não falha.
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qa
          if-no-files-found: ignore
          retention-days: 14
          path: |
            backend/relatorio_testes.json
            backend/htmlcov/
            backend/coverage.xml
            backend/.pytest_cache/
