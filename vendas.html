<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>
    <meta name="description" content="Carregando...">
    <meta name="keywords" content="">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <link id="favicon-link" rel="icon" href="">
    <link rel="stylesheet" href="assets/css/tailwind.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/design-system.css?v=1">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Fraunces', serif; }
    </style>
</head>
<body class="text-gray-900 antialiased">
    <div class="grain-overlay"></div>
    <div id="app"></div>

    <script src="assets/js/motion.js?v=1"></script>
    <script>
        let config = {};

        async function loadConfig() {
            try {
                const response = await fetch('./vendas-config.json');
                config = await response.json();
                render();
            } catch (error) {
                console.error('Erro ao carregar configuração:', error);
                document.getElementById('app').innerHTML = '<p class="text-red-500 p-4">Erro ao carregar configuração</p>';
            }
        }

        function render() {
            const app = document.getElementById('app');
            document.title = config.metadata.siteTitle;
            document.querySelector('meta[name="description"]').setAttribute('content', config.metadata.siteDescription);
            document.querySelector('meta[name="keywords"]').setAttribute('content', (config.metadata.keywords || []).join(', '));
            document.querySelector('meta[property="og:title"]').setAttribute('content', config.metadata.ogTitle || config.metadata.siteTitle);
            document.querySelector('meta[property="og:description"]').setAttribute('content', config.metadata.ogDescription || config.metadata.siteDescription);
            document.body.style.backgroundColor = config.colors.background;
            setFavicon(config.metadata.favicon || '🏗️');

            app.innerHTML = `
                ${renderNavigation()}
                ${renderHero()}
                ${renderTicker()}
                ${renderProofStrip()}
                ${renderHowItWorks()}
                ${renderDifferentials()}
                ${renderPortfolio()}
                ${renderPricing()}
                ${renderPlatformProof()}
                ${renderFAQ()}
                ${renderCTA()}
                ${renderFooter()}
                ${renderWhatsAppButton()}
            `;

            setupNavBehavior();
            initScrollReveal();
            initWhatsAppLabel();
            initMagnetic();
            initCountUp();
        }

        function formatDate(iso) {
            const [y, m, d] = (iso || '').split('-');
            return (y && m && d) ? `${d}/${m}/${y}` : '';
        }

        function setupNavBehavior() {
            const nav = document.getElementById('site-nav');
            if (nav) {
                const onScroll = () => {
                    if (window.scrollY > 8) nav.classList.add('shadow-md');
                    else nav.classList.remove('shadow-md');
                };
                window.addEventListener('scroll', onScroll);
                onScroll();
            }
        }

        function waHref(mensagem) {
            return waLink(config.company.whatsapp, mensagem);
        }

        function renderWhatsAppButton() {
            const link = waHref(`Olá! Vi a página da ${config.company.name} e quero saber mais sobre o site pro meu negócio.`);
            return `
                <a href="${link}" target="_blank" rel="noopener" aria-label="Falar no WhatsApp"
                   class="whatsapp-pulse fixed right-5 z-50 flex items-center gap-2 text-white pl-4 pr-5 py-3.5 shadow-xl transition transform hover:scale-105"
                   style="background-color: ${config.colors.accent}; border-radius: 20px 20px 4px 20px; bottom: calc(1.25rem + env(safe-area-inset-bottom));">
                    ${WHATSAPP_ICON}
                    <span id="wa-label" class="wa-label-fade hidden sm:inline font-display italic font-medium text-sm">Fale agora</span>
                </a>
            `;
        }

        function renderNavigation() {
            return `
                <nav id="site-nav" class="sticky top-0 z-40 backdrop-blur-md transition-shadow duration-300" style="background-color: ${config.colors.background}cc">
                    <div class="max-w-6xl mx-auto px-5 sm:px-6 py-4 flex justify-between items-center">
                        <span class="font-display font-semibold text-lg tracking-tight" style="color: ${config.colors.primary}">${config.company.name}</span>
                        <div class="hidden md:flex items-center gap-8">
                            <a href="#como-funciona" class="font-medium text-sm transition hover:opacity-70" style="color: ${config.colors.text}">Como funciona</a>
                            <a href="#portfolio" class="font-medium text-sm transition hover:opacity-70" style="color: ${config.colors.text}">Portfólio</a>
                            <a href="#preco" class="font-medium text-sm transition hover:opacity-70" style="color: ${config.colors.text}">Preço</a>
                            <a href="${waHref('Olá! Vi a página da ' + config.company.name + ' e quero saber mais sobre o site pro meu negócio.')}" target="_blank" rel="noopener" class="text-white px-5 py-2.5 rounded-full text-sm font-semibold transition hover:shadow-lg" style="background-color: ${config.colors.primary}">Falar no WhatsApp</a>
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderHeroVisual() {
            const cards = (config.platformProof && config.platformProof.cards) || [];
            if (cards.length === 0) return '';
            return `
                <div class="relative h-64 sm:h-80 lg:h-[420px] mt-4 lg:mt-0">
                    <div class="absolute inset-x-6 sm:inset-x-10 lg:inset-x-0 top-0 w-[85%] sm:w-3/4 rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/20" style="transform: rotate(-3deg);">
                        <img src="${cards[1].image}?v=1" alt="${cards[1].imageAlt}" class="w-full h-40 sm:h-52 lg:h-64 object-cover object-top" loading="lazy">
                    </div>
                    <div class="hidden sm:block absolute top-10 right-0 w-2/3 rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/20" style="transform: rotate(4deg);">
                        <img src="${cards[0].image}?v=1" alt="${cards[0].imageAlt}" class="w-full h-40 lg:h-48 object-cover object-top" loading="lazy">
                    </div>
                    <div class="hidden lg:block absolute -bottom-2 left-2 w-1/2 rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/20" style="transform: rotate(-6deg);">
                        <img src="${cards[2].image}?v=1" alt="${cards[2].imageAlt}" class="w-full h-40 object-cover object-top" loading="lazy">
                    </div>
                </div>
            `;
        }

        function renderHero() {
            const link = waHref(`Olá! Vi a página da ${config.company.name} e quero meu site.`);
            return `
                <section class="hero-in relative overflow-hidden min-h-[80vh] flex items-center" style="background: linear-gradient(150deg, ${config.colors.primary} 10%, ${config.colors.primaryDark} 60%, ${config.colors.text} 130%)">
                    <div class="max-w-6xl mx-auto px-5 sm:px-6 py-20 sm:py-24 relative z-10 w-full">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-center">
                            <div class="text-center lg:text-left">
                                <span class="font-display italic inline-block text-base sm:text-lg text-white/85 mb-5">Prospecção + geração de site com IA</span>
                                <h1 class="font-display text-4xl sm:text-5xl md:text-6xl font-medium mb-6 leading-[1.1] tracking-tight text-white">
                                    ${staggerWords(config.hero.title)}
                                </h1>
                                <p class="text-lg md:text-xl mb-10 max-w-xl mx-auto lg:mx-0 text-white/90 leading-relaxed">
                                    ${config.hero.subtitle}
                                </p>
                                <a href="${link}" target="_blank" rel="noopener" id="hero-cta" class="magnetic bg-white px-8 py-4 rounded-full font-bold text-base inline-flex items-center justify-center gap-2 transition hover:shadow-2xl" style="color: ${config.colors.primary}">
                                    ${WHATSAPP_ICON} ${config.hero.ctaText}
                                </a>
                            </div>
                            ${renderHeroVisual()}
                        </div>
                    </div>
                </section>
            `;
        }

        function tickerItems() {
            const items = [];
            if (config.company.tagline) items.push(config.company.tagline);
            (config.differentials || []).forEach(d => items.push(d.title));
            (config.portfolio || []).forEach(p => items.push(p.nicho.split(' — ')[0]));
            if (config.proof && config.proof.leadsMapeados) items.push(`${config.proof.leadsMapeados} empresas locais mapeadas`);
            items.push('Resposta rápida no WhatsApp');
            return items;
        }

        function renderTicker() {
            return renderTickerMarkup(tickerItems(), config.colors.primaryDark);
        }

        function renderProofStrip() {
            const leads = (config.proof && config.proof.leadsMapeados) || 0;
            const demos = (config.portfolio || []).length;
            if (!leads && !demos) return '';
            const asOf = config.proof && config.proof.asOf ? formatDate(config.proof.asOf) : '';
            return `
                <section class="reveal py-14">
                    <div class="max-w-3xl mx-auto px-5 sm:px-6 grid grid-cols-2 gap-6 text-center">
                        <div class="glass-card px-6 py-8 rounded-3xl">
                            <div class="font-display text-4xl md:text-5xl font-medium" style="color: ${config.colors.primary}"><span data-countup data-target="${leads}" data-decimals="0">0</span></div>
                            <p class="text-sm mt-2" style="color: ${config.colors.textLight}">empresas locais já mapeadas sem site${asOf ? `<span class="block text-xs opacity-70 mt-1">dado de ${asOf}</span>` : ''}</p>
                        </div>
                        <div class="glass-card px-6 py-8 rounded-3xl">
                            <div class="font-display text-4xl md:text-5xl font-medium" style="color: ${config.colors.primary}"><span data-countup data-target="${demos}" data-decimals="0">0</span></div>
                            <p class="text-sm mt-2" style="color: ${config.colors.textLight}">demonstrações reais já entregues</p>
                        </div>
                    </div>
                </section>
            `;
        }

        function sectionEyebrow(text) {
            return `
                <div class="flex items-center justify-center gap-3 mb-4">
                    <span class="w-6 h-px" style="background-color: ${config.colors.accent}"></span>
                    <span class="font-display italic text-base" style="color: ${config.colors.primary}">${text}</span>
                    <span class="w-6 h-px" style="background-color: ${config.colors.accent}"></span>
                </div>
            `;
        }

        function renderFlowSteps(steps) {
            return `
                <div class="relative">
                    <div class="hidden md:block absolute top-6 left-0 right-0 h-px" style="background-color: ${config.colors.border}"></div>
                    <div class="relative grid grid-cols-1 md:grid-cols-4 gap-10 md:gap-6">
                        ${steps.map((s, i) => `
                            <div class="reveal relative" style="transition-delay: ${i * 90}ms">
                                <div class="relative z-10 w-12 h-12 rounded-full flex items-center justify-center font-display text-lg font-bold text-white mb-4 mx-auto md:mx-0" style="background-color: ${config.colors.primary}">${s.step}</div>
                                <h3 class="text-lg font-bold mb-2 text-center md:text-left" style="color: ${config.colors.text}">${s.title}</h3>
                                <p class="text-sm leading-relaxed text-center md:text-left" style="color: ${config.colors.textLight}">${s.description}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderHowItWorks() {
            const steps = config.howItWorks || [];
            if (steps.length === 0) return '';
            return `
                <section id="como-funciona" class="reveal py-20 md:py-28">
                    <div class="max-w-6xl mx-auto px-5 sm:px-6">
                        <div class="text-center max-w-2xl mx-auto mb-14">
                            ${sectionEyebrow('Como funciona')}
                            <h2 class="font-display text-3xl md:text-4xl font-medium mb-4 tracking-tight" style="color: ${config.colors.text}">
                                Do WhatsApp ao site no ar
                            </h2>
                        </div>
                        ${renderFlowSteps(steps)}
                    </div>
                </section>
            `;
        }

        function renderPlatformProof() {
            const p = config.platformProof;
            if (!p || !(p.cards || []).length) return '';
            return `
                <section class="reveal py-20 md:py-28" style="background-color: ${config.colors.primary}08">
                    <div class="max-w-6xl mx-auto px-5 sm:px-6">
                        <div class="text-center max-w-2xl mx-auto mb-14">
                            ${sectionEyebrow(p.eyebrow || 'Por trás da plataforma')}
                            <h2 class="font-display text-3xl md:text-4xl font-medium mb-4 tracking-tight" style="color: ${config.colors.text}">
                                ${p.heading}
                            </h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${p.cards.map((card, i) => `
                                <div class="reveal glass-card rounded-2xl overflow-hidden shadow-sm" style="transition-delay: ${i * 90}ms">
                                    <img src="${card.image}?v=1" alt="${card.imageAlt || card.title}" class="w-full h-40 object-cover object-top" loading="lazy">
                                    <div class="p-6">
                                        <div class="text-2xl mb-2">${card.icon}</div>
                                        <h3 class="text-base font-bold mb-1" style="color: ${config.colors.text}">${card.title}</h3>
                                        <p class="text-xs font-semibold mb-2" style="color: ${config.colors.primary}">${card.subtitle}</p>
                                        <p class="text-sm leading-relaxed" style="color: ${config.colors.textLight}">${card.description}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderDifferentials() {
            const items = config.differentials || [];
            if (items.length === 0) return '';
            return `
                <section class="reveal py-20 md:py-28" style="background-color: ${config.colors.primary}08">
                    <div class="max-w-6xl mx-auto px-5 sm:px-6">
                        <div class="text-center max-w-2xl mx-auto mb-14">
                            ${sectionEyebrow('Diferenciais')}
                            <h2 class="font-display text-3xl md:text-4xl font-medium mb-4 tracking-tight" style="color: ${config.colors.text}">
                                Por que não é só mais um site
                            </h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${items.map(item => `
                                <div class="bg-white p-8 rounded-2xl shadow-sm flex gap-5">
                                    <div class="w-14 h-14 flex-shrink-0 rounded-xl flex items-center justify-center text-2xl" style="background-color: ${config.colors.primary}14">${item.icon}</div>
                                    <div>
                                        <h3 class="text-lg font-bold mb-2" style="color: ${config.colors.text}">${item.title}</h3>
                                        <p class="text-sm leading-relaxed" style="color: ${config.colors.textLight}">${item.description}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderPortfolio() {
            const items = config.portfolio || [];
            if (items.length === 0) return '';
            return `
                <section id="portfolio" class="reveal py-20 md:py-28">
                    <div class="max-w-6xl mx-auto px-5 sm:px-6">
                        <div class="text-center max-w-2xl mx-auto mb-14">
                            ${sectionEyebrow('Portfólio')}
                            <h2 class="font-display text-3xl md:text-4xl font-medium mb-4 tracking-tight" style="color: ${config.colors.text}">
                                Exemplos reais que já entregamos
                            </h2>
                        </div>
                        <div class="flex overflow-x-auto snap-x snap-mandatory gap-6 pb-4 no-scrollbar -mx-5 px-5 sm:mx-0 sm:px-0 sm:justify-center sm:flex-wrap">
                            ${items.map((item, i) => `
                                <a href="${item.url}" target="_blank" rel="noopener" class="reveal snap-start shrink-0 w-[85%] sm:w-[380px] block bg-white p-8 rounded-2xl border transition hover:shadow-xl hover:-translate-y-1" style="border-color: ${config.colors.border}; transition-delay: ${i * 90}ms">
                                    <h3 class="font-display text-xl font-medium mb-2" style="color: ${config.colors.text}">${item.name}</h3>
                                    <p class="text-sm mb-4" style="color: ${config.colors.textLight}">${item.nicho}</p>
                                    <span class="text-sm font-semibold inline-flex items-center gap-1" style="color: ${config.colors.primary}">Ver site →</span>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderPricing() {
            const p = config.pricing;
            if (!p || !p.base) return '';
            const link = waHref(`Olá! Vi o plano da ${config.company.name} e quero saber mais.`);
            return `
                <section id="preco" class="reveal py-20 md:py-28" style="background-color: ${config.colors.primary}08">
                    <div class="max-w-2xl mx-auto px-5 sm:px-6">
                        <div class="text-center mb-10">
                            ${sectionEyebrow('Investimento')}
                            <h2 class="font-display text-3xl md:text-4xl font-medium tracking-tight" style="color: ${config.colors.text}">
                                ${p.garantia ? p.garantia.title : 'Sem letra miúda'}
                            </h2>
                        </div>
                        <div class="glass-card bg-white p-10 rounded-3xl shadow-lg text-center mb-6" style="border: 1px solid ${config.colors.border}">
                            <p class="text-xs font-bold uppercase tracking-widest mb-3" style="color: ${config.colors.primary}">${p.base.title || 'Plano Base'}</p>
                            <div class="mb-6">
                                <span class="font-display text-5xl font-medium" style="color: ${config.colors.primary}">${p.base.price}</span>
                                <span class="text-lg" style="color: ${config.colors.textLight}">${p.base.period}</span>
                            </div>
                            <ul class="space-y-3 mb-8 text-left max-w-sm mx-auto">
                                ${p.base.features.map(f => `
                                    <li class="flex items-start gap-2 text-sm" style="color: ${config.colors.text}">
                                        <span class="mt-0.5 flex-shrink-0" style="color: ${config.colors.accent}">✓</span> ${f}
                                    </li>
                                `).join('')}
                            </ul>
                            <a href="${link}" target="_blank" rel="noopener" class="block text-white px-8 py-4 rounded-full font-bold text-base transition hover:shadow-lg" style="background-color: ${config.colors.primary}">
                                ${p.ctaText}
                            </a>
                        </div>
                        ${p.opcionais ? `
                            <div class="bg-white p-8 rounded-2xl border mb-6" style="border-color: ${config.colors.border}">
                                <p class="text-xs font-bold uppercase tracking-widest mb-2" style="color: ${config.colors.primary}">${p.opcionais.title}</p>
                                <p class="text-sm mb-4" style="color: ${config.colors.textLight}">${p.opcionais.description}</p>
                                <ul class="space-y-2.5">
                                    ${p.opcionais.items.map(o => `
                                        <li class="text-sm" style="color: ${config.colors.text}"><span class="font-semibold">${o.name}</span> <span style="color: ${config.colors.textLight}">— ${o.description}</span></li>
                                    `).join('')}
                                </ul>
                            </div>
                        ` : ''}
                        ${p.garantia ? `<p class="text-center text-sm" style="color: ${config.colors.textLight}">${p.garantia.text}</p>` : ''}
                    </div>
                </section>
            `;
        }

        function renderFAQ() {
            const items = config.faq || [];
            if (items.length === 0) return '';
            return `
                <section class="reveal py-20 md:py-28">
                    <div class="max-w-3xl mx-auto px-5 sm:px-6">
                        <div class="text-center mb-14">
                            ${sectionEyebrow('FAQ')}
                            <h2 class="font-display text-3xl md:text-4xl font-medium mb-4 tracking-tight" style="color: ${config.colors.text}">
                                Perguntas frequentes
                            </h2>
                        </div>
                        <div class="space-y-3">
                            ${items.map(item => `
                                <details class="bg-white p-6 rounded-2xl shadow-sm">
                                    <summary class="font-bold cursor-pointer flex justify-between items-center gap-4" style="color: ${config.colors.text}">
                                        <span>${item.question}</span>
                                        <span class="faq-icon flex-shrink-0" style="color: ${config.colors.primary}">
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                                        </span>
                                    </summary>
                                    <p class="mt-4 leading-relaxed" style="color: ${config.colors.textLight}">${item.answer}</p>
                                </details>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderCTA() {
            const link = waHref(`Olá! Vi a página da ${config.company.name} e quero começar meu site.`);
            return `
                <section class="reveal py-20 md:py-24" style="background: linear-gradient(135deg, ${config.colors.primary}, ${config.colors.primaryDark})">
                    <div class="max-w-3xl mx-auto px-5 sm:px-6 text-center">
                        <h2 class="font-display text-3xl md:text-4xl font-medium mb-4 text-white tracking-tight">${config.cta.title}</h2>
                        <p class="text-lg mb-9 text-white/85 leading-relaxed">${config.cta.description}</p>
                        <a href="${link}" target="_blank" rel="noopener" class="bg-white px-9 py-4 rounded-full font-bold text-base inline-flex items-center gap-2 transition transform hover:scale-105 hover:shadow-2xl" style="color: ${config.colors.primary}">
                            ${WHATSAPP_ICON} ${config.cta.buttonText}
                        </a>
                    </div>
                </section>
            `;
        }

        function renderFooter() {
            return `
                <footer class="reveal" style="background-color: ${config.colors.text}">
                    <div class="max-w-6xl mx-auto px-5 sm:px-6 py-12 text-center">
                        <p class="font-display text-lg text-white mb-2">${config.company.name}</p>
                        <p class="text-gray-400 text-sm mb-6 max-w-md mx-auto">${config.footer.description}</p>
                        <p class="text-gray-500 text-xs">${config.footer.copyrightText}</p>
                    </div>
                </footer>
            `;
        }

        document.addEventListener('DOMContentLoaded', loadConfig);
    </script>
</body>
</html>
